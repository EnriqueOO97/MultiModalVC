# @package _group_
# MelVC: mel-output model (BigVGAN-format mels) + pure L1 mel criterion.
# Forked from mms-speech-nollm-e2e-synthvc.yaml: model -> MelVC, criterion -> melvc_l1.

common:
  fp16: false
  bf16: true
  log_format: json
  log_interval: 1
  tensorboard_logdir: tblog
  seed: 1
  user_dir: ???
  empty_cache_freq: 5

checkpoint:
  save_interval: 1
  keep_last_epochs: 1
  save_interval_updates: 0
  best_checkpoint_metric: loss
  maximize_best_checkpoint_metric: false
  no_epoch_checkpoints: false

distributed_training:
  ddp_backend: c10d
  find_unused_parameters: false
  distributed_world_size: 1
  nprocs_per_node: 1

task:
  _name: MMS_LLaMA_pathological_finetune
  is_s2s: true
  data: ???
  label_dir: ???
  tokenizer_bpe_model: ???
  normalize: true
  labels: ["wrd"]
  single_target: true
  fine_tuning: true
  stack_order_audio: 4
  tokenizer_bpe_name: sentencepiece
  max_sample_size: 500
  min_sample_size: 10
  modalities: ["video", "audio"]
  image_aug: true
  pad_audio: true
  random_crop: false
  llm_path: "meta-llama/Llama-3.2-3B"
  noise_prob: 0.0
  noise_wav: null

dataset:
  num_workers: 3
  max_tokens: 4000
  validate_after_updates: 0
  validate_interval: 1
  train_subset: train
  valid_subset: valid

criterion:
  _name: melvc_l1
  mel_loss_weight: 1.0
  source_sr: 16000
  target_sr: 22050
  mel_bands: 80
  n_fft: 1024
  hop_size: 256
  win_size: 1024
  fmin: 0
  fmax: 8000
  # Task-2 warp loss (default off): soft-DTW added alongside mel L1; duration loss.
  softdtw_weight: 0.0
  softdtw_gamma: 0.1
  dur_loss_weight: 0.0

optimization:
  max_epoch: 20000
  max_update: 300000
  lr: [3e-5]
  sentence_avg: true
  update_freq: [2]
  clip_norm: 20.0

optimizer:
  _name: adam
  adam_betas: (0.9,0.98)
  adam_eps: 1e-08
  weight_decay: 0.01

lr_scheduler:
  _name: fixed
  warmup_updates: 2000

model:
  _name: MMS_Speech_NoLLM_MelVC
  ###### avhubert ########
  w2v_path: ???
  apply_mask: false
  mask_selection: static
  mask_length: 10
  mask_other: 0
  mask_prob: 0.75
  mask_channel_selection: static
  mask_channel_length: 64
  mask_channel_other: 0
  mask_channel_prob: 0.5
  layerdrop: 0.1
  dropout: 0.0
  activation_dropout: 0.1
  attention_dropout: 0.0
  feature_grad_mult: 1.0
  freeze_finetune_updates: 0

  ###### AV Fusion ######
  whisper_embed_dim: 1024
  avhubert_embed_dim: 1024
  modality_fuse: concat

  ##### Q Former #######
  use_qformer: true
  queries_per_sec: 2
  qformer_layers: 2
  qformer_dim: 1024

  ##### Speech Rate Predictor #######
  use_sr_predictor: true

  ##### Speech Synthesis Specific #######
  speech_upsample_factor: 4

  ##### Modality Dropout #######
  p_modality_av: 1.0
  p_modality_video_only: 0.0
  p_modality_audio_only: 0.0

  ##### MelVC Specific #######
  mel_bands: 80
  bigvgan_hop: 256
  bigvgan_sr: 22050
  source_sr: 16000
  ##### Task-1 length + Task-2 warp (default OFF -> current behaviour) #####
  use_content_xattn: false
  content_interleave_start: odd
  use_duration_predictor: false
  dur_pred_layers: 2
  dur_r_min: 0.5
  stage1_checkpoint: ???
  vocoder_checkpoint: ???
  freeze_stage1: true
  normalize: true

hydra:
  run:
    dir: ???
  sweep:
    dir: ???
    subdir: ${hydra.job.config_name}__${hydra.job.override_dirname}
